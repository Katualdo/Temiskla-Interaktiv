<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Temiskla – Interaktive Karte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        crossorigin="">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="map"></div>

  <div id="coords" class="coords-panel" aria-live="polite">
    <div class="coords-title">Koordinaten</div>
    <div id="coordsText">Bewege die Maus über die Karte</div>
    <button id="copyCoords" type="button" disabled>Koordinaten kopieren</button>
  </div>

  <div id="help" class="help-panel">
    <strong>Koordinatenmodus</strong>
    <label>
      <input id="coordinateMode" type="checkbox">
      Klick auf Karte zeigt X/Y
    </label>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
